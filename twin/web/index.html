<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一臂三身 · 数字层</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles.css">

<!-- importmap 必须出现在任何 type="module" 脚本之前。
     "three/" 这条前缀映射是必须的：urdf-loader 内部 import 的是
     'three/examples/jsm/loaders/STLLoader.js'，只映射 "three" 会 404。 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/": "./vendor/three/",
    "urdf-loader": "./vendor/urdf-loader/src/URDFLoader.js"
  }
}
</script>
</head>
<body>

<header id="masthead">
  <div class="mast-left">
    <ul class="bodies">
      <li class="body off"><b>Ⅰ</b><span>实体</span><em>不在本屏</em></li>
      <li class="body"><b>Ⅱ</b><span>数字层</span></li>
      <li class="body"><b>Ⅲ</b><span>代码</span></li>
    </ul>
    <h1>
      <span class="zh">一臂三身</span>
      <span class="en">One Arm, Three Bodies</span>
    </h1>
  </div>
  <div class="mast-gap" aria-hidden="true"></div>
  <div id="topline" class="topline"></div>
</header>

<main id="spread">
  <section id="stage">
    <div id="viewport"></div>
    <div class="crops" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</p>
    <div id="loading">
      <span class="spinner" aria-hidden="true"></span>
      <span class="msg">正在加载模型…</span>
    </div>
  </section>

  <div id="rule" aria-hidden="true"></div>

  <aside id="console" aria-label="代码层"></aside>
</main>

<pre id="diag" hidden></pre>

<script type="module" src="./src/main.js"></script>
</body>
</html>
